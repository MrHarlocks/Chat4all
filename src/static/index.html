<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat4all - Interface Gráfica</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #f0f0f0; border-right: 1px solid #ccc; padding: 20px; display: flex; flex-direction: column; }
        #main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        #messages { flex: 1; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #fff; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; max-width: 70%; }
        .message.sent { background: #dcf8c6; align-self: flex-end; margin-left: auto; }
        .message.received { background: #fff; border: 1px solid #eee; }
        .status { font-size: 0.8em; color: #888; text-align: right; }
        #input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="login-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h2>Chat4all Login</h2>
        <input type="text" id="login-display-name" placeholder="Seu Nome" style="padding: 10px; margin: 10px; width: 300px;">
        <button onclick="login()" style="padding: 10px 20px;">Entrar</button>
    </div>

    <div id="app-container" style="display: none; width: 100%; height: 100%;">
        <div id="sidebar">
            <h3>Conversas</h3>
            <div id="user-info" style="margin-bottom: 10px; font-size: 0.9em; color: #555;"></div>
            <div id="conversation-controls">
                <input type="text" id="new-conv-participants" placeholder="Nomes participantes (vírgula)">
                <select id="new-conv-type" onchange="toggleGroupTitle()">
                    <option value="PRIVATE">Privado</option>
                    <option value="GROUP">Grupo</option>
                </select>
                <input type="text" id="new-group-title" placeholder="Nome do Grupo" style="display: none;">
                <button onclick="createConversation()">Criar</button>
            </div>
            <hr>
            <div id="conversation-list">
                <!-- Lista de conversas será inserida aqui -->
            </div>
        </div>
        <div id="main">
            <h2 id="chat-title">Selecione uma conversa</h2>
            <div id="messages"></div>
            <div id="input-area">
                <input type="file" id="file-input" style="display: none;" onchange="uploadFile()">
                <button onclick="document.getElementById('file-input').click()" style="padding: 10px;">📎</button>
                <input type="text" id="message-input" placeholder="Digite sua mensagem...">
                <!-- Sender ID is now managed globally -->
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
